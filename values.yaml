# Gotify — Argo CD uses expectedbehaviors/gotify chart; this file is values-only (no wrapper).
# Base chart provides: probes, resources, TZ (UTC), service. Override only ingress and persistence (Longhorn pre-created PVC).
# No 1Password items synced — app admin password managed in Gotify UI.
onepassworditem:
  enabled: false

gotify:
  ingress:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/target: expectedbehaviors.com
      hosts:
        - host: gotify.expectedbehaviors.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - gotify.expectedbehaviors.com
          secretName: expectedbehaviors.com-tls
  persistence:
    data:
      enabled: true
      # app-template's schema treats existingClaim and the size/storageClass/accessMode
      # trio as mutually exclusive, so the chart defaults must be cleared here.
      existingClaim: gotify-data
      accessMode: null
      size: null
      storageClass: null
      globalMounts:
        - path: /app/data
          readOnly: false
