# Instantiation: base chart from expectedbehaviors/gotify; override in values.yaml (gotify.*, onepassworditem.*).
# Run: helm repo add gotify https://expectedbehaviors.github.io/gotify && helm repo update
apiVersion: v2
name: gotify
description: Gotify — self-hosted push notification server (REST API, WebSocket). Base: expectedbehaviors/gotify; OIDC via nginx.
version: 0.1.0
appVersion: "2.4.4"
kubeVersion: ">=1.22.0-0"
keywords:
  - gotify
  - notifications
  - push
home: https://gotify.net
sources:
  - https://github.com/gotify/server
  - https://github.com/expectedbehaviors/gotify
maintainers: []
dependencies:
  - name: gotify
    version: "1.0.0"
    repository: https://expectedbehaviors.github.io/gotify
